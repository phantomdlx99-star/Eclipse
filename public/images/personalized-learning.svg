<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1f2e" rx="20"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main path/route lines -->
  <g stroke="url(#goldGradient)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 50 60 Q 100 40 140 80"/>
    <path d="M 50 100 Q 100 85 140 120"/>
    <path d="M 50 140 Q 100 130 140 160"/>
  </g>
  
  <!-- Dots on paths -->
  <circle cx="50" cy="60" r="4" fill="url(#goldGradient)"/>
  <circle cx="100" cy="40" r="3" fill="#f59e0b" opacity="0.7"/>
  <circle cx="140" cy="80" r="4" fill="url(#goldGradient)"/>
  
  <circle cx="50" cy="100" r="4" fill="url(#goldGradient)"/>
  <circle cx="100" cy="85" r="3" fill="#f59e0b" opacity="0.7"/>
  <circle cx="140" cy="120" r="4" fill="url(#goldGradient)"/>
  
  <circle cx="50" cy="140" r="4" fill="url(#goldGradient)"/>
  <circle cx="100" cy="130" r="3" fill="#f59e0b" opacity="0.7"/>
  <circle cx="140" cy="160" r="4" fill="url(#goldGradient)"/>
  
  <!-- Connecting lines between paths -->
  <line x1="50" y1="60" x2="50" y2="100" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="50" y1="100" x2="50" y2="140" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>
</svg>