<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="chemistryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a2d4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#251f33;stop-opacity:1" />
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#chemistryGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="100" r="50" fill="#f59e0b" opacity="0.1"/>
  <circle cx="80" cy="320" r="60" fill="#f59e0b" opacity="0.08"/>
  
  <!-- Test tubes with colored liquids -->
  <g filter="url(#glow4)">
    <!-- Left tube -->
    <rect x="100" y="160" width="40" height="120" rx="8" fill="none" stroke="#fcd34d" stroke-width="3"/>
    <rect x="105" y="200" width="30" height="80" fill="#f59e0b" opacity="0.4"/>
    <circle cx="120" cy="160" r="22" fill="none" stroke="#fcd34d" stroke-width="3"/>
    
    <!-- Middle tube -->
    <rect x="180" y="140" width="40" height="140" rx="8" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <rect x="185" y="180" width="30" height="100" fill="#fcd34d" opacity="0.4"/>
    <circle cx="200" cy="140" r="22" fill="none" stroke="#f59e0b" stroke-width="3"/>
    
    <!-- Right tube -->
    <rect x="260" y="170" width="40" height="110" rx="8" fill="none" stroke="#fcd34d" stroke-width="3"/>
    <rect x="265" y="200" width="30" height="80" fill="#f59e0b" opacity="0.35"/>
    <circle cx="280" cy="170" r="22" fill="none" stroke="#fcd34d" stroke-width="3"/>
  </g>
  
  <!-- Bubbles rising -->
  <g filter="url(#glow4)">
    <circle cx="120" cy="180" r="4" fill="#fcd34d" opacity="0.7"/>
    <circle cx="125" cy="165" r="3" fill="#f59e0b" opacity="0.6"/>
    <circle cx="200" cy="160" r="5" fill="#fcd34d" opacity="0.7"/>
    <circle cx="205" cy="145" r="3" fill="#f59e0b" opacity="0.6"/>
    <circle cx="280" cy="190" r="4" fill="#fcd34d" opacity="0.7"/>
    <circle cx="285" cy="175" r="3" fill="#f59e0b" opacity="0.6"/>
  </g>
  
  <!-- Reaction arrow -->
  <g filter="url(#glow4)">
    <line x1="160" y1="240" x2="240" y2="240" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
    <polygon points="240,240 230,235 230,245" fill="#fcd34d"/>
  </g>
  
  <!-- Electron shells (atom structure) -->
  <g filter="url(#glow4)" opacity="0.6">
    <circle cx="320" cy="280" r="8" fill="#fcd34d"/>
    <circle cx="320" cy="280" r="20" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="320" cy="280" r="35" fill="none" stroke="#fcd34d" stroke-width="1.5"/>
    <!-- Electrons -->
    <circle cx="340" cy="280" r="2" fill="#f59e0b"/>
    <circle cx="310" cy="260" r="2" fill="#fcd34d"/>
    <circle cx="300" cy="300" r="2" fill="#f59e0b"/>
  </g>
  
  <!-- Decorative corner element -->
  <line x1="30" y1="50" x2="80" y2="50" stroke="#fcd34d" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="50" x2="30" y2="100" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
</svg>