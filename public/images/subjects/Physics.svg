<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="physicsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2433;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#physicsGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="50" fill="#f59e0b" opacity="0.1"/>
  <circle cx="300" cy="280" r="60" fill="#f59e0b" opacity="0.08"/>
  
  <!-- Pendulum -->
  <g filter="url(#glow3)">
    <!-- Pivot point -->
    <circle cx="200" cy="80" r="8" fill="#fcd34d"/>
    
    <!-- String -->
    <line x1="200" y1="88" x2="150" y2="200" stroke="#f59e0b" stroke-width="2"/>
    <line x1="200" y1="88" x2="250" y2="200" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Bob -->
    <circle cx="150" cy="210" r="15" fill="#fcd34d" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="250" cy="210" r="15" fill="#fcd34d" stroke="#f59e0b" stroke-width="2"/>
  </g>
  
  <!-- Wave/Energy lines -->
  <g filter="url(#glow3)">
    <path d="M 80 280 Q 100 270 120 280 T 160 280" 
          fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60 300 Q 80 290 100 300 T 140 300" 
          fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Force arrow -->
  <g filter="url(#glow3)">
    <line x1="240" y1="300" x2="320" y2="300" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
    <!-- Arrow head -->
    <polygon points="320,300 310,295 310,305" fill="#fcd34d"/>
    <!-- Label: "F" -->
    <text x="265" y="285" font-size="24" font-weight="bold" fill="#f59e0b" font-family="Arial">F</text>
  </g>
  
  <!-- Circular motion indicator -->
  <g filter="url(#glow3)">
    <circle cx="100" cy="200" r="30" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <circle cx="100" cy="200" r="40" fill="none" stroke="#fcd34d" stroke-width="1" opacity="0.4"/>
    <!-- Rotation arrow -->
    <path d="M 130 170 A 35 35 0 0 1 140 145" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
    <polygon points="140,145 142,160 128,152" fill="#fcd34d"/>
  </g>
  
  <!-- Corner accent -->
  <rect x="20" y="320" width="50" height="50" fill="none" stroke="#fcd34d" stroke-width="2" opacity="0.5" transform="rotate(45 45 345)"/>
</svg>