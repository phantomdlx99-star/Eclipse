<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="accountancyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#262420;stop-opacity:1" />
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#accountancyGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="80" cy="100" r="50" fill="#f59e0b" opacity="0.1"/>
  <circle cx="320" cy="320" r="60" fill="#f59e0b" opacity="0.08"/>
  
  <!-- Ledger/Balance book -->
  <g filter="url(#glow5)">
    <!-- Pages -->
    <rect x="100" y="120" width="80" height="140" fill="none" stroke="#fcd34d" stroke-width="3" rx="4"/>
    <line x1="100" y1="130" x2="180" y2="130" stroke="#f59e0b" stroke-width="2"/>
    <line x1="100" y1="145" x2="180" y2="145" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
    <line x1="100" y1="160" x2="180" y2="160" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
    <line x1="100" y1="175" x2="180" y2="175" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
    <line x1="100" y1="190" x2="180" y2="190" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Right page with numbers -->
    <rect x="220" y="120" width="80" height="140" fill="none" stroke="#f59e0b" stroke-width="3" rx="4"/>
    <text x="230" y="140" font-size="14" font-weight="bold" fill="#fcd34d" font-family="Arial">Income</text>
    <text x="235" y="160" font-size="11" fill="#f59e0b" font-family="Arial">$1,200</text>
    <text x="235" y="180" font-size="11" fill="#f59e0b" font-family="Arial">$800</text>
    <line x1="220" y1="195" x2="300" y2="195" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="235" y="215" font-size="12" font-weight="bold" fill="#fcd34d" font-family="Arial">$2,000</text>
  </g>
  
  <!-- Balance scale/scales -->
  <g filter="url(#glow5)">
    <circle cx="200" cy="280" r="6" fill="#fcd34d"/>
    <!-- Left side -->
    <line x1="200" y1="280" x2="140" y2="250" stroke="#f59e0b" stroke-width="2"/>
    <rect x="120" y="240" width="40" height="30" fill="none" stroke="#fcd34d" stroke-width="2" rx="2"/>
    <!-- Right side -->
    <line x1="200" y1="280" x2="260" y2="250" stroke="#f59e0b" stroke-width="2"/>
    <rect x="240" y="240" width="40" height="30" fill="none" stroke="#fcd34d" stroke-width="2" rx="2"/>
  </g>
  
  <!-- Currency symbols -->
  <g filter="url(#glow5)" opacity="0.7">
    <text x="300" y="180" font-size="28" fill="#fcd34d" font-family="Arial">$</text>
    <text x="80" y="280" font-size="28" fill="#f59e0b" font-family="Arial">£</text>
  </g>
  
  <!-- Checkmark (approved/verified) -->
  <g filter="url(#glow5)">
    <path d="M 320 320 L 335 335 L 360 310" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative brackets -->
  <path d="M 40 200 L 50 160 L 50 240" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <path d="M 360 200 L 350 160 L 350 240" fill="none" stroke="#fcd34d" stroke-width="2" opacity="0.5"/>
</svg>