<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="mathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#mathGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="80" cy="80" r="50" fill="#f59e0b" opacity="0.1"/>
  <circle cx="320" cy="320" r="60" fill="#f59e0b" opacity="0.08"/>
  
  <!-- Mathematical symbols and shapes -->
  <!-- Plus sign -->
  <g filter="url(#glow)">
    <line x1="80" y1="120" x2="80" y2="180" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
    <line x1="50" y1="150" x2="110" y2="150" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Equation symbol (equals) -->
  <g filter="url(#glow)">
    <line x1="200" y1="140" x2="280" y2="140" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line x1="200" y1="170" x2="280" y2="170" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Graph/curve -->
  <g filter="url(#glow)">
    <path d="M 50 280 Q 100 260 150 240 T 250 200" stroke="#fcd34d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Axes -->
    <line x1="40" y1="290" x2="280" y2="290" stroke="#f59e0b" stroke-width="4"/>
    <line x1="50" y1="300" x2="50" y2="150" stroke="#f59e0b" stroke-width="4"/>
  </g>
  
  <!-- Grid background accent -->
  <g stroke="#f59e0b" stroke-width="1" opacity="0.15">
    <line x1="100" y1="100" x2="300" y2="100"/>
    <line x1="100" y1="150" x2="300" y2="150"/>
    <line x1="100" y1="200" x2="300" y2="200"/>
    <line x1="100" y1="100" x2="100" y2="200"/>
    <line x1="200" y1="100" x2="200" y2="200"/>
    <line x1="300" y1="100" x2="300" y2="200"/>
  </g>
  
  <!-- Corner accent -->
  <rect x="300" y="20" width="60" height="60" fill="none" stroke="#fcd34d" stroke-width="2" opacity="0.6"/>
</svg>