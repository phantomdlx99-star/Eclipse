<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="statisticsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d4a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2f25;stop-opacity:1" />
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#statisticsGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="100" r="50" fill="#f59e0b" opacity="0.1"/>
  <circle cx="80" cy="300" r="60" fill="#f59e0b" opacity="0.08"/>
  
  <!-- Bar chart -->
  <g filter="url(#glow6)">
    <!-- Axes -->
    <line x1="80" y1="280" x2="340" y2="280" stroke="#f59e0b" stroke-width="3"/>
    <line x1="80" y1="280" x2="80" y2="100" stroke="#f59e0b" stroke-width="3"/>
    
    <!-- Bars -->
    <rect x="110" y="200" width="35" height="80" fill="#fcd34d" opacity="0.7" stroke="#fcd34d" stroke-width="2" rx="2"/>
    <rect x="165" y="150" width="35" height="130" fill="#f59e0b" opacity="0.7" stroke="#f59e0b" stroke-width="2" rx="2"/>
    <rect x="220" y="170" width="35" height="110" fill="#fcd34d" opacity="0.7" stroke="#fcd34d" stroke-width="2" rx="2"/>
    <rect x="275" y="120" width="35" height="160" fill="#f59e0b" opacity="0.7" stroke="#f59e0b" stroke-width="2" rx="2"/>
  </g>
  
  <!-- Line graph overlay -->
  <g filter="url(#glow6)">
    <polyline points="127,200 182,150 237,170 292,120" fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- Data points -->
    <circle cx="127" cy="200" r="4" fill="#fcd34d"/>
    <circle cx="182" cy="150" r="4" fill="#fcd34d"/>
    <circle cx="237" cy="170" r="4" fill="#fcd34d"/>
    <circle cx="292" cy="120" r="4" fill="#fcd34d"/>
  </g>
  
  <!-- Pie chart (partial) in corner -->
  <g filter="url(#glow6)">
    <circle cx="300" cy="340" r="35" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <!-- Pie segments -->
    <path d="M 300 340 L 330 340 A 30 30 0 0 1 315 310 Z" fill="#fcd34d" opacity="0.5"/>
    <path d="M 300 340 L 315 310 A 30 30 0 0 1 285 315 Z" fill="#f59e0b" opacity="0.5"/>
    <path d="M 300 340 L 285 315 A 30 30 0 0 1 330 340 Z" fill="#fcd34d" opacity="0.3"/>
  </g>
  
  <!-- Correlation arrows (showing data relationships) -->
  <g filter="url(#glow6)" opacity="0.6">
    <line x1="50" y1="100" x2="100" y2="150" stroke="#fcd34d" stroke-width="2" stroke-dasharray="5,5"/>
    <polygon points="100,150 95,140 105,138" fill="#fcd34d"/>
    
    <line x1="350" y1="200" x2="300" y2="250" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5"/>
    <polygon points="300,250 308,245 310,255" fill="#f59e0b"/>
  </g>
  
  <!-- Percentage symbol decorations -->
  <g filter="url(#glow6)" opacity="0.7">
    <text x="100" y="50" font-size="24" fill="#f59e0b" font-family="Arial">%</text>
    <text x="310" y="70" font-size="20" fill="#fcd34d" font-family="Arial">∑</text>
  </g>
</svg>