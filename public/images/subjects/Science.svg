<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="scienceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3d3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2625;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#scienceGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="50" fill="#f59e0b" opacity="0.1"/>
  <circle cx="80" cy="300" r="60" fill="#f59e0b" opacity="0.08"/>
  
  <!-- Molecule structure -->
  <g filter="url(#glow2)">
    <!-- Central atoms -->
    <circle cx="200" cy="150" r="12" fill="#fcd34d" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="150" cy="120" r="10" fill="#f59e0b"/>
    <circle cx="250" cy="120" r="10" fill="#f59e0b"/>
    <circle cx="130" cy="180" r="10" fill="#f59e0b"/>
    <circle cx="270" cy="180" r="10" fill="#f59e0b"/>
    
    <!-- Bonds -->
    <line x1="200" y1="150" x2="150" y2="120" stroke="#fcd34d" stroke-width="3"/>
    <line x1="200" y1="150" x2="250" y2="120" stroke="#fcd34d" stroke-width="3"/>
    <line x1="200" y1="150" x2="130" y2="180" stroke="#fcd34d" stroke-width="3"/>
    <line x1="200" y1="150" x2="270" y2="180" stroke="#fcd34d" stroke-width="3"/>
  </g>
  
  <!-- Beaker/Flask -->
  <g filter="url(#glow2)">
    <path d="M 120 240 L 130 280 Q 130 310 160 310 Q 190 310 190 280 L 200 240" 
          fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="240" x2="200" y2="240" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Liquid inside -->
    <path d="M 135 280 Q 135 300 160 300 Q 185 300 185 280" 
          fill="#fcd34d" opacity="0.3"/>
  </g>
  
  <!-- Bubbles/atoms around -->
  <circle cx="280" cy="260" r="8" fill="#fcd34d" opacity="0.7" filter="url(#glow2)"/>
  <circle cx="310" cy="290" r="6" fill="#f59e0b" opacity="0.6" filter="url(#glow2)"/>
  <circle cx="100" cy="350" r="5" fill="#fcd34d" opacity="0.5" filter="url(#glow2)"/>
  
  <!-- Decorative lines -->
  <line x1="220" y1="80" x2="260" y2="100" stroke="#fcd34d" stroke-width="2" opacity="0.4"/>
  <line x1="240" y1="330" x2="290" y2="350" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
</svg>