<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1f2e" rx="20"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="goldGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Quiz card 1 -->
  <rect x="35" y="40" width="55" height="65" fill="none" stroke="url(#goldGradient2)" stroke-width="2" rx="8"/>
  <line x1="40" y1="55" x2="85" y2="55" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
  <line x1="40" y1="65" x2="85" y2="65" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
  <circle cx="42" cy="80" r="2.5" fill="#f59e0b"/>
  <line x1="47" y1="80" x2="83" y2="80" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  <circle cx="42" cy="90" r="2.5" fill="#f59e0b"/>
  <line x1="47" y1="90" x2="83" y2="90" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  
  <!-- Quiz card 2 -->
  <rect x="110" y="55" width="55" height="65" fill="none" stroke="url(#goldGradient2)" stroke-width="2" rx="8"/>
  <line x1="115" y1="70" x2="160" y2="70" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
  <line x1="115" y1="80" x2="160" y2="80" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
  <circle cx="117" cy="95" r="2.5" fill="#f59e0b"/>
  <line x1="122" y1="95" x2="158" y2="95" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  <circle cx="117" cy="105" r="2.5" fill="#f59e0b"/>
  <line x1="122" y1="105" x2="158" y2="105" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  
  <!-- Brain/AI symbol in center -->
  <circle cx="100" cy="130" r="18" fill="none" stroke="url(#goldGradient2)" stroke-width="2"/>
  <circle cx="100" cy="130" r="10" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
  <circle cx="95" cy="130" r="2.5" fill="#f59e0b"/>
  <circle cx="105" cy="130" r="2.5" fill="#f59e0b"/>
  <circle cx="100" cy="125" r="2.5" fill="#f59e0b"/>
  <circle cx="100" cy="135" r="2.5" fill="#f59e0b"/>
  
  <!-- Connecting lines -->
  <line x1="62" y1="105" x2="90" y2="125" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
  <line x1="137" y1="120" x2="110" y2="128" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
</svg>